[supervisord]
user=bytebot
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:set-hostname]
command=bash -c "sudo hostname bytebot-desktop"
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
priority=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
command=Xvfb :1 -screen 0 1280x960x24 -ac -nolisten tcp
user=bytebot
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
user=bytebot
command=sh -c 'sleep 3 && \
  export XDG_CONFIG_HOME=$HOME/.config && \
  export XDG_DATA_HOME=$HOME/.local/share && \
  export XDG_CACHE_HOME=$HOME/.cache && \
  export XDG_CONFIG_DIRS=/etc/xdg && \
  export XDG_DATA_DIRS=/usr/share && \
  exec openbox-session'
environment=DISPLAY=:1,HOME="/home/bytebot"
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
depends_on=xvfb

[program:x11vnc]
command=x11vnc -display :1 -N -forever -shared -rfbport 5900 -passwd bytebot
user=bytebot
autostart=true
autorestart=true
startsecs=5
priority=30
environment=DISPLAY=:1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
depends_on=openbox

[program:websockify]
command=websockify 6080 localhost:5900
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
depends_on=x11vnc

[program:bytebotd]
user=bytebot
command=node /app/bytebotd/dist/main.js
directory=/app/bytebotd
autostart=true
autorestart=true
startsecs=10
priority=60
environment=DISPLAY=:1,NODE_ENV=production
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
depends_on=websockify

[eventlistener:startup]
command=echo "Bytebot Desktop Automation Container started successfully"
events=PROCESS_STATE_RUNNING
buffer_size=100