version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway.dockerfile
    container_name: turi-x-api-gateway
    ports:
      - "8083:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s