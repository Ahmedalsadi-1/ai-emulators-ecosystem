groups:
  - name: ecosystem_recording_rules
    rules:
      # Service Health Metrics
      - record: service_up:rate5m
        expr: rate(up[5m])

      - record: service_up:rate1h
        expr: rate(up[1h])

      # Resource Usage Metrics
      - record: node_memory_usage_percent
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      - record: node_cpu_usage_percent
        expr: (1 - rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100

      - record: node_disk_usage_percent
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100

      # Database Metrics
      - record: postgres_connection_utilization
        expr: pg_stat_activity_count / pg_settings_max_connections

      - record: redis_memory_usage_percent
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100

      # Application Performance Metrics
      - record: http_request_rate_total
        expr: rate(http_requests_total[5m])

      - record: http_error_rate_total
        expr: rate(http_requests_total{status=~"5.."}[5m])

      - record: http_error_rate_percent
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100

      - record: http_request_duration_seconds_p50
        expr: histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[5m]))

      - record: http_request_duration_seconds_p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))

      - record: http_request_duration_seconds_p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))

      # Container Metrics
      - record: container_memory_usage_bytes
        expr: container_memory_usage_bytes

      - record: container_cpu_usage_percent
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100

      - record: container_network_receive_bytes_total
        expr: rate(container_network_receive_bytes_total[5m])

      - record: container_network_transmit_bytes_total
        expr: rate(container_network_transmit_bytes_total[5m])

      # GPU Metrics (for AI services)
      - record: gpu_memory_usage_percent
        expr: gpu_memory_used_bytes / gpu_memory_total_bytes * 100

      - record: gpu_power_usage_watts
        expr: gpu_power_draw_watts

      - record: gpu_temperature_celsius
        expr: gpu_temperature_celsius

      # Business Metrics (custom)
      - record: active_users_total
        expr: active_users

      - record: requests_per_user
        expr: rate(http_requests_total[5m]) / active_users

      - record: service_health_score
        expr: (up * 100) - (rate(http_requests_total{status=~"5.."}[5m]) * 10)

      # Network Metrics
      - record: network_bytes_received_total
        expr: rate(node_network_receive_bytes_total[5m])

      - record: network_bytes_transmitted_total
        expr: rate(node_network_transmit_bytes_total[5m])

      - record: network_errors_total
        expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m])

      # System Load Metrics
      - record: system_load_average_1m
        expr: node_load1

      - record: system_load_average_5m
        expr: node_load5

      - record: system_load_average_15m
        expr: node_load15

      # Disk I/O Metrics
      - record: disk_reads_total
        expr: rate(node_disk_reads_completed_total[5m])

      - record: disk_writes_total
        expr: rate(node_disk_writes_completed_total[5m])

      - record: disk_io_time_percent
        expr: rate(node_disk_io_time_seconds_total[5m]) * 100