version: '3.8'

services:
  postiz-api-wrapper:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: postiz-api-wrapper
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - POSTIZ_API_URL=http://postiz-app:3000
      - POSTIZ_API_KEY=${POSTIZ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=info
      - REQUEST_TIMEOUT=30000
    ports:
      - "3001:3001"
    networks:
      - turix-network
    depends_on:
      - postiz-app
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: postiz-api-wrapper-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - turix-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  turix-network:
    external: true
    name: turix-network

volumes:
  redis_data:
    driver: local