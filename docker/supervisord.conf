[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor/

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
priority=1

[program:bytebot-agent]
command=node /app/bytebot/packages/bytebot-agent/dist/main.js
directory=/app/bytebot/packages/bytebot-agent
autostart=true
autorestart=true
environment=NODE_ENV=production,DATABASE_URL="postgresql://bytebot:password@postgres:5432/bytebot",REDIS_URL="redis://redis:6379"
stdout_logfile=/var/log/supervisor/bytebot-agent.out.log
stderr_logfile=/var/log/supervisor/bytebot-agent.err.log
priority=2

[program:factif-ai-backend]
command=node /app/factif-ai/backend/dist/server.js
directory=/app/factif-ai/backend
autostart=true
autorestart=true
environment=NODE_ENV=production,DATABASE_URL="postgresql://factif:password@postgres:5432/factif",REDIS_URL="redis://redis:6379"
stdout_logfile=/var/log/supervisor/factif-ai.out.log
stderr_logfile=/var/log/supervisor/factif-ai.err.log
priority=3

[program:mcp-registry]
command=node /app/mcp-registry/dist/index.js
directory=/app/mcp-registry
autostart=true
autorestart=true
environment=NODE_ENV=production,REDIS_URL="redis://redis:6379"
stdout_logfile=/var/log/supervisor/mcp-registry.out.log
stderr_logfile=/var/log/supervisor/mcp-registry.err.log
priority=4

[program:aios]
command=python3 -m uvicorn runtime.launch:app --host 0.0.0.0 --port 8000
directory=/app/AIOS
autostart=true
autorestart=true
environment=NODE_ENV=production,DATABASE_URL="postgresql://aios:password@postgres:5432/aios",REDIS_URL="redis://redis:6379"
stdout_logfile=/var/log/supervisor/aios.out.log
stderr_logfile=/var/log/supervisor/aios.err.log
priority=5