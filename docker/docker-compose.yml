name: bytebot

services:
  # Primary BYTEBOT EDGE Instance 1
  bytebot-edge-1:
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    shm_size: "2g"
    container_name: bytebot-edge-1
    restart: unless-stopped
    hostname: computer-1
    privileged: true
    ports:
      - "9990:9990"
      - "9991:9991"
    environment:
      - DISPLAY=:0
      - PORT=9991
      - COMPUTER_NAME=bytebot-edge-1
    networks:
      - bytebot-network

  # BYTEBOT EDGE Instance 2
  bytebot-edge-2:
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    shm_size: "2g"
    container_name: bytebot-edge-2
    restart: unless-stopped
    hostname: computer-2
    privileged: true
    ports:
      - "9993:9990"
      - "9994:9991"
    environment:
      - DISPLAY=:0
      - PORT=9991
      - COMPUTER_NAME=bytebot-edge-2
    networks:
      - bytebot-network

  # BYTEBOT EDGE Instance 3
  bytebot-edge-3:
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    shm_size: "2g"
    container_name: bytebot-edge-3
    restart: unless-stopped
    hostname: computer-3
    privileged: true
    ports:
      - "9995:9990"
      - "9996:9991"
    environment:
      - DISPLAY=:0
      - PORT=9991
      - COMPUTER_NAME=bytebot-edge-3
    networks:
      - bytebot-network

  postgres:
    image: postgres:16-alpine
    container_name: bytebot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bytebotdb
    networks:
      - bytebot-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bytebot-agent:
    image: ghcr.io/bytebot-ai/bytebot-agent:edge
    container_name: bytebot-agent
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bytebotdb}
      - BYTEBOT_DESKTOP_BASE_URL_1=${BYTEBOT_DESKTOP_BASE_URL_1:-http://bytebot-edge-1:9991}
      - BYTEBOT_DESKTOP_BASE_URL_2=${BYTEBOT_DESKTOP_BASE_URL_2:-http://bytebot-edge-2:9991}
      - BYTEBOT_DESKTOP_BASE_URL_3=${BYTEBOT_DESKTOP_BASE_URL_3:-http://bytebot-edge-3:9991}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ROUTEWAY_API_KEY=${ROUTEWAY_API_KEY}
    depends_on:
      - postgres
    networks:
      - bytebot-network

  bytebot-ui:
    image: ghcr.io/bytebot-ai/bytebot-ui:edge
    container_name: bytebot-ui
    restart: unless-stopped
    ports:
      - "9992:9992"
    environment:
      - NODE_ENV=production
      - BYTEBOT_AGENT_BASE_URL=${BYTEBOT_AGENT_BASE_URL:-http://bytebot-agent:9991}
      - BYTEBOT_DESKTOP_VNC_URL_1=${BYTEBOT_DESKTOP_VNC_URL_1:-ws://bytebot-edge-1:9990}
      - BYTEBOT_DESKTOP_VNC_URL_2=${BYTEBOT_DESKTOP_VNC_URL_2:-ws://bytebot-edge-2:9990}
      - BYTEBOT_DESKTOP_VNC_URL_3=${BYTEBOT_DESKTOP_VNC_URL_3:-ws://bytebot-edge-3:9990}
    depends_on:
      - bytebot-agent
    networks:
      - bytebot-network

networks:
  bytebot-network:
    driver: bridge

volumes:
  postgres_data:
