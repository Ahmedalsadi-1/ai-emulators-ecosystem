[supervisord]
nodaemon=true
user=root

[program:vncserver]
command=/bin/bash -lc "rm -f /tmp/.X1-lock /tmp/.X11-unix/X1; vncserver -kill :1 >/dev/null 2>&1 || true; /usr/bin/env USER=root HOME=/root vncserver :1 -geometry 1920x1080 -depth 24 -localhost no"
user=root
autorestart=true
startsecs=3
startretries=10

[program:novnc]
command=websockify --web /usr/share/novnc/ 6080 localhost:5901
user=root
autorestart=true
