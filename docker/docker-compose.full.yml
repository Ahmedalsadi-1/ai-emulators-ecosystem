name: bytebot-full

services:
  postgres:
    image: postgres:16-alpine
    container_name: bytebot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bytebotdb
    networks:
      - bytebot-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bytebot-desktop:
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    pull_policy: always
    container_name: bytebot-desktop
    shm_size: "2g"
    restart: unless-stopped
    hostname: computer-bytebot
    privileged: true
    ports:
      - "9990:9990"  # bytebotd + websockify for Bytebot
    environment:
      - DISPLAY=:0
      - NODE_ENV=development
      - BYTEBOT_AUTH_ENABLED=false
      - BYTEBOT_AUTH_BYPASS=true
    networks:
      - bytebot-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9990 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bytebot-desktop-debian:
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    pull_policy: always
    container_name: bytebot-desktop-debian
    shm_size: "2g"
    restart: unless-stopped
    hostname: computer-debian
    privileged: true
    ports:
      - "9995:9990"  # bytebotd + websockify for Debian
    environment:
      - DISPLAY=:0
      - NODE_ENV=development
      - BYTEBOT_AUTH_ENABLED=false
      - BYTEBOT_AUTH_BYPASS=true
    networks:
      - bytebot-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9990 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bytebot-desktop-kali:
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    pull_policy: always
    container_name: bytebot-desktop-kali
    shm_size: "2g"
    restart: unless-stopped
    hostname: computer-kali
    privileged: true
    ports:
      - "9993:9990"  # bytebotd + websockify for Kali
    environment:
      - DISPLAY=:0
      - NODE_ENV=development
      - BYTEBOT_AUTH_ENABLED=false
      - BYTEBOT_AUTH_BYPASS=true
    networks:
      - bytebot-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9990 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  browseros-desktop:
    build:
      context: ./browseros-desktop
    image: bytebot-browseros-desktop:local
    container_name: browseros-desktop
    shm_size: "2g"
    restart: unless-stopped
    hostname: browseros
    privileged: true
    ports:
      - "9994:6080"  # websockify (noVNC) for BrowserOS
    environment:
      - DISPLAY=:1
      - NODE_ENV=development
    networks:
      - bytebot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6080 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bytebot-agent:
    image: ghcr.io/bytebot-ai/bytebot-agent:edge
    pull_policy: never
    container_name: bytebot-agent
    restart: unless-stopped
    ports:
      - "9991:9991"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bytebotdb
      - BYTEBOT_DESKTOP_BASE_URL=http://bytebot-desktop:9990
      - NODE_ENV=development
      - BYTEBOT_AUTH_BYPASS=true
      # API Keys from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ROUTEWAY_API_KEY=${ROUTEWAY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      bytebot-desktop:
        condition: service_healthy
    networks:
      - bytebot-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9991 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bytebot-ui:
    image: ghcr.io/bytebot-ai/bytebot-ui:edge
    pull_policy: always
    container_name: bytebot-ui
    profiles:
      - ui
    restart: unless-stopped
    ports:
      - "9992:9992"
    environment:
      - BYTEBOT_AGENT_BASE_URL=http://bytebot-agent:9991
      - BYTEBOT_DESKTOP_VNC_URL=ws://bytebot-desktop:9990/websockify
      - DEBIAN_DESKTOP_VNC_URL=ws://bytebot-desktop-debian:9990/websockify
      - BYTEBOT_DESKTOP_KALI_VNC_URL=ws://bytebot-desktop-kali:9990/websockify
      - BROWSEROS_DESKTOP_VNC_URL=ws://browseros-desktop:6080/websockify
      - NEXT_PUBLIC_BROWSEROS_CONTROL_ENDPOINT=ws://browseros-desktop:6080/websockify
      - NEXT_PUBLIC_BROWSEROS_WEBSOCKIFY_PATH=/api/proxy/browseros-websockify
      - NEXT_PUBLIC_BROWSEROS_VNC_PASSWORD=browseros
      - NODE_ENV=development
    depends_on:
      bytebot-agent:
        condition: service_healthy
      bytebot-desktop:
        condition: service_healthy
      bytebot-desktop-debian:
        condition: service_healthy
      bytebot-desktop-kali:
        condition: service_healthy
      browseros-desktop:
        condition: service_healthy
    networks:
      - bytebot-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9992 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  bytebot-network:
    driver: bridge

volumes:
  postgres_data:
