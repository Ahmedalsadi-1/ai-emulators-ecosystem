---
name: Feature Request
about: Suggest a new feature or enhancement for the Unified AI Ecosystem
title: '[FEATURE] '
labels: ['enhancement', 'feature-request']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Request
        Help us build the future of AI automation!

  - type: dropdown
    id: agent
    attributes:
      label: Target Agent
      description: Which agent should implement this feature?
      options:
        - Agent A (Test Infrastructure)
        - Agent B (Real-Time Integration)
        - Agent C (Advanced Systems)
        - Cross-Agent Feature
        - Infrastructure
        - CLI/Tools
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (MVP blocker)
        - High (Should have)
        - Medium (Nice to have)
        - Low (Future consideration)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What's the problem this feature would solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
      placeholder: I think we should...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative approaches?
      placeholder: I also considered...

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples
      placeholder: |
        - Related issues: #123
        - Design docs: [link]
        - User feedback: [quotes]

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Feature request requirements
      options:
        - label: I have searched existing issues for duplicates
        - label: This feature aligns with the project's multi-agent architecture
        - label: I understand this may require coordination across multiple agents
        - label: I'm willing to contribute to implementation if possible