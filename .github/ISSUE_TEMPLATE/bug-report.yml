---
name: Bug Report
about: Report a bug in the Unified AI Ecosystem
title: '[BUG] '
labels: ['bug', 'triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report
        Thanks for helping us improve the Unified AI Ecosystem!

  - type: dropdown
    id: agent
    attributes:
      label: Affected Agent
      description: Which agent is experiencing the issue?
      options:
        - Agent A (Test Infrastructure)
        - Agent B (Real-Time Integration)
        - Agent C (Advanced Systems)
        - Multiple Agents
        - Infrastructure
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How critical is this bug?
      options:
        - Critical (System Down)
        - High (Major Feature Broken)
        - Medium (Feature Impaired)
        - Low (Minor Issue)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System information and versions
      placeholder: |
        - OS: [e.g., macOS 14.0, Ubuntu 22.04]
        - Node.js: [e.g., 18.17.0]
        - Python: [e.g., 3.11.5]
        - Docker: [e.g., 24.0.6]
        - Agent Manager: [e.g., 1.2.3]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs & Screenshots
      description: Please provide relevant logs, error messages, or screenshots
      placeholder: |
        ```
        Paste error logs here
        ```

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please verify these items
      options:
        - label: I have searched existing issues for duplicates
        - label: I have provided all requested information
        - label: I have tested with the latest version
        - label: I understand this is a bug report, not a feature request