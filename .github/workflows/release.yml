name: Release Management

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Create prerelease'
        required: false
        default: false
        type: boolean

jobs:
  # ==========================================
  # Version Management
  # ==========================================

  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_notes: ${{ steps.release-notes.outputs.release_notes }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install semantic-release
      run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

    - name: Determine next version
      id: version
      run: |
        # Get current version from package.json
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "Current version: $CURRENT_VERSION"

        # Determine release type from commits or workflow input
        if [ "${{ github.event.inputs.release_type }}" ]; then
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
        else
          # Analyze commits since last release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log --oneline $LAST_TAG..HEAD)

          if echo "$COMMITS" | grep -q "BREAKING CHANGE\|feat!:"; then
            RELEASE_TYPE="major"
          elif echo "$COMMITS" | grep -q "^feat:"; then
            RELEASE_TYPE="minor"
          else
            RELEASE_TYPE="patch"
          fi
        fi

        # Calculate next version
        IFS='.' read -ra VERSION_PARTS <<< "${CURRENT_VERSION#v}"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}

        case $RELEASE_TYPE in
          major)
            NEW_VERSION="$((MAJOR + 1)).0.0"
            ;;
          minor)
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
            ;;
          patch)
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            ;;
        esac

        # Add prerelease suffix if requested
        if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
          PRERELEASE_SUFFIX="-$(date +%Y%m%d%H%M%S)"
          NEW_VERSION="$NEW_VERSION$PRERELEASE_SUFFIX"
        fi

        TAG="v$NEW_VERSION"

        echo "New version: $NEW_VERSION"
        echo "Tag: $TAG"
        echo "Release type: $RELEASE_TYPE"

        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Generate release notes
      id: release-notes
      run: |
        # Generate changelog from conventional commits
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -n "$LAST_TAG" ]; then
          RELEASE_NOTES=$(git log --pretty=format:"%s" $LAST_TAG..HEAD | awk '
            /^feat:/ { features = features "\n- " substr($0, 6) }
            /^fix:/ { fixes = fixes "\n- " substr($0, 5) }
            /^docs:/ { docs = docs "\n- " substr($0, 6) }
            /^style:/ { style = style "\n- " substr($0, 7) }
            /^refactor:/ { refactor = refactor "\n- " substr($0, 10) }
            /^test:/ { tests = tests "\n- " substr($0, 6) }
            /^chore:/ { chores = chores "\n- " substr($0, 7) }
            /^BREAKING CHANGE:/ { breaking = breaking "\n- BREAKING: " substr($0, 16) }
            END {
              if (features) print "## ✨ Features" features
              if (fixes) print "## 🐛 Bug Fixes" fixes
              if (breaking) print "## ⚠️  Breaking Changes" breaking
              if (refactor) print "## 🔄 Refactoring" refactor
              if (tests) print "## 🧪 Tests" tests
              if (docs) print "## 📚 Documentation" docs
              if (style) print "## 💅 Styling" style
              if (chores) print "## 🔧 Maintenance" chores
            }
          ')
        else
          RELEASE_NOTES="## 🎉 Initial Release\n\n- First release of AI Emulators Ecosystem"
        fi

        # Escape newlines for GitHub output
        RELEASE_NOTES="${RELEASE_NOTES//'%'/'%25'}"
        RELEASE_NOTES="${RELEASE_NOTES//$'\n'/'%0A'}"
        RELEASE_NOTES="${RELEASE_NOTES//$'\r'/'%0D'}"

        echo "release_notes<<EOF" >> $GITHUB_OUTPUT
        echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

  # ==========================================
  # Build Release Artifacts
  # ==========================================

  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: version
    outputs:
      artifacts: ${{ steps.artifacts.outputs.artifacts }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push release images
      run: |
        VERSION=${{ needs.version.outputs.version }}
        TAG=${{ needs.version.outputs.tag }}

        # Build and tag all service images
        docker build -t ghcr.io/${{ github.repository }}/ecosystem:$TAG \
                     -t ghcr.io/${{ github.repository }}/ecosystem:latest \
                     -f Dockerfile.ecosystem .

        # Push images
        docker push ghcr.io/${{ github.repository }}/ecosystem:$TAG
        docker push ghcr.io/${{ github.repository }}/ecosystem:latest

        # Build individual service images
        SERVICES=("aios" "bytebot" "factif-ai" "postiz-app" "mcp-registry")
        for service in "${SERVICES[@]}"; do
          docker build -t ghcr.io/${{ github.repository }}/$service:$TAG \
                       -t ghcr.io/${{ github.repository }}/$service:latest \
                       -f Dockerfile.ecosystem --target production .

          docker push ghcr.io/${{ github.repository }}/$service:$TAG
          docker push ghcr.io/${{ github.repository }}/$service:latest
        done

    - name: Build CLI binaries
      run: |
        # Build cross-platform binaries for CLI tools
        npm install -g pkg @vercel/ncc

        # Build bytebot CLI
        cd bytebot/packages/bytebot-agent
        npx ncc build src/main.ts -o dist-cli
        pkg dist-cli/index.js --targets node18-linux-x64,node18-macos-x64,node18-win-x64 --output ../../bin/bytebot

        # Build factif CLI
        cd ../../../factif-ai/backend
        npx ncc build src/index.ts -o dist-cli
        pkg dist-cli/index.js --targets node18-linux-x64,node18-macos-x64,node18-win-x64 --output ../../bin/factif

        cd ../../..

    - name: Create release archives
      run: |
        VERSION=${{ needs.version.outputs.version }}

        # Create source archive
        git archive --format=tar.gz -o ai-ecosystem-$VERSION.tar.gz --prefix=ai-ecosystem-$VERSION/ HEAD

        # Create binary archives
        mkdir -p release-artifacts/bin
        cp bin/* release-artifacts/bin/ 2>/dev/null || true
        cp ai-ecosystem-$VERSION.tar.gz release-artifacts/

        # Create checksums
        cd release-artifacts
        sha256sum * > checksums.txt
        cd ..

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: release-artifacts/

    - name: Set artifacts output
      id: artifacts
      run: |
        echo "artifacts<<EOF" >> $GITHUB_OUTPUT
        echo "ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz" >> $GITHUB_OUTPUT
        echo "checksums.txt" >> $GITHUB_OUTPUT
        find bin -name "*" -type f | head -10 >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

  # ==========================================
  # Create GitHub Release
  # ==========================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-release]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-artifacts
        path: ./artifacts

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        release_name: Release ${{ needs.version.outputs.tag }}
        body: |
          ## 🚀 AI Emulators Ecosystem ${{ needs.version.outputs.version }}

          ${{ needs.version.outputs.release_notes }}

          ### 📦 Downloads
          - **Source Code**: [ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz)
          - **Checksums**: [checksums.txt](https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/checksums.txt)

          ### 🐳 Docker Images
          ```bash
          docker pull ghcr.io/${{ github.repository }}/ecosystem:${{ needs.version.outputs.tag }}
          ```

          ### 🔧 Installation
          ```bash
          # Download and extract
          wget https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz
          tar -xzf ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz
          cd ai-ecosystem-${{ needs.version.outputs.version }}

          # Start the ecosystem
          docker-compose -f docker-compose.ecosystem.yml up -d
          ```

          ### 📋 What's Changed
          - Full changelog available in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
        draft: false
        prerelease: ${{ contains(needs.version.outputs.tag, '-') }}

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./artifacts/ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz
        asset_name: ai-ecosystem-${{ needs.version.outputs.version }}.tar.gz
        asset_content_type: application/gzip

    - name: Upload checksums
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./artifacts/checksums.txt
        asset_name: checksums.txt
        asset_content_type: text/plain

  # ==========================================
  # Update Changelog
  # ==========================================

  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    needs: [version, release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update CHANGELOG.md
      run: |
        VERSION=${{ needs.version.outputs.version }}
        TAG=${{ needs.version.outputs.tag }}
        DATE=$(date +%Y-%m-%d)

        # Create new changelog entry
        cat > new-entry.md << EOF
        ## [$VERSION](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG) - $DATE

        ${{ needs.version.outputs.release_notes }}

        EOF

        # Update CHANGELOG.md
        if [ -f CHANGELOG.md ]; then
          # Insert new entry after header
          sed -i '3r new-entry.md' CHANGELOG.md
        else
          # Create new CHANGELOG.md
          cat > CHANGELOG.md << EOF
        # Changelog

        All notable changes to the AI Emulators Ecosystem will be documented in this file.

        The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
        and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

        EOF
          cat new-entry.md >> CHANGELOG.md
        fi

        rm new-entry.md

    - name: Commit changelog update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add CHANGELOG.md
        git commit -m "docs: update changelog for $TAG" || echo "No changes to commit"

    - name: Push changelog update
      run: |
        git push

  # ==========================================
  # Deploy to Production
  # ==========================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, build-release, release]
    if: github.ref == 'refs/heads/main' && !contains(needs.version.outputs.tag, '-')
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig.yaml
        kubectl config use-context production-cluster

    - name: Update Helm chart version
      run: |
        VERSION=${{ needs.version.outputs.version }}

        # Update Chart.yaml
        sed -i "s/^version:.*/version: $VERSION/" helm/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/Chart.yaml

        # Update values.yaml with new image tags
        sed -i "s|tag:.*|tag: \"$VERSION\"|g" helm/values-production.yaml

    - name: Deploy to production
      run: |
        VERSION=${{ needs.version.outputs.version }}

        # Deploy using Helm
        helm upgrade --install ai-ecosystem-$VERSION ./helm \
          --values helm/values-production.yaml \
          --namespace production \
          --create-namespace \
          --wait \
          --timeout 15m \
          --set image.tag=$VERSION

    - name: Run production validation
      run: |
        # Wait for rollout to complete
        kubectl rollout status deployment/ai-ecosystem -n production --timeout=600s

        # Run smoke tests
        kubectl run smoke-test --image=curlimages/curl --rm -i --restart=Never -- \
          curl -f http://ai-ecosystem/health && \
          curl -f http://ai-ecosystem/api/health && \
          echo "✅ Production deployment successful"

    - name: Notify production deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "AI Emulators Ecosystem ${{ needs.version.outputs.version }} deployed to Production"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}

  # ==========================================
  # Post-Release Notifications
  # ==========================================

  notify:
    name: Send Release Notifications
    runs-on: ubuntu-latest
    needs: [version, release, deploy-production]
    if: always()

    steps:
    - name: Generate release summary
      run: |
        VERSION=${{ needs.version.outputs.version }}
        TAG=${{ needs.version.outputs.tag }}

        echo "# 🎉 Release Summary: AI Emulators Ecosystem $VERSION" > release-summary.md
        echo "" >> release-summary.md
        echo "**Release Tag:** $TAG" >> release-summary.md
        echo "**Release Date:** $(date)" >> release-summary.md
        echo "**Repository:** ${{ github.repository }}" >> release-summary.md
        echo "" >> release-summary.md

        # Deployment status
        echo "## 🚀 Deployment Status" >> release-summary.md
        echo "" >> release-summary.md
        if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
          echo "✅ **Production Deployment:** Successful" >> release-summary.md
          echo "- Environment: Production" >> release-summary.md
          echo "- URL: https://ai-ecosystem.example.com" >> release-summary.md
        else
          echo "❌ **Production Deployment:** Failed" >> release-summary.md
          echo "- Check deployment logs for details" >> release-summary.md
        fi
        echo "" >> release-summary.md

        # Release notes
        echo "## 📋 Release Notes" >> release-summary.md
        echo "${{ needs.version.outputs.release_notes }}" >> release-summary.md
        echo "" >> release-summary.md

        # Next steps
        echo "## 🎯 Next Steps" >> release-summary.md
        echo "" >> release-summary.md
        echo "- Monitor application metrics and logs" >> release-summary.md
        echo "- Update documentation if needed" >> release-summary.md
        echo "- Communicate release to stakeholders" >> release-summary.md
        echo "- Plan next development cycle" >> release-summary.md

    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "AI Emulators Ecosystem $VERSION released and deployed"
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_RELEASE }}

    - name: Send email notification (optional)
      if: failure()
      run: |
        # This would integrate with email service
        echo "Release completed with issues. Manual intervention may be required."

    - name: Upload release summary
      uses: actions/upload-artifact@v4
      with:
        name: release-summary
        path: release-summary.md