# AI Ecosystem CI/CD Pipeline
# Comprehensive CI/CD for production deployment

name: AI Ecosystem CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'bytebot/**'
      - 'orchestrator/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'bytebot/**'
      - 'orchestrator/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - 'monitoring/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security and Quality Checks
  security-scan:
    name: Security & Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run security audit
        run: |
          # Check for secrets in code
          if grep -r "password\|secret\|key" --include="*.yml" --include="*.yaml" --include="*.json" . | grep -v "example\|template\|backup"; then
            echo "Potential secrets found in code!"
            exit 1
          fi

  # Code Quality Checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bytebot, orchestrator]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Run linting
        run: |
          cd ${{ matrix.service }}
          npm run lint

      - name: Run tests
        run: |
          cd ${{ matrix.service }}
          npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ${{ matrix.service }}/coverage

  # Docker Build and Test
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    strategy:
      matrix:
        service: [bytebot-desktop, bytebot-agent, bytebot-ui, orchestrator]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bytebot/packages/${{ matrix.service }}/Dockerfile
          push: false  # Don't push yet, just build and test
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Basic container test
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }} --version || true

  # Infrastructure Tests
  infrastructure-test:
    name: Infrastructure Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          docker --version
          docker-compose --version

      - name: Validate docker-compose files
        run: |
          docker-compose -f docker-compose.prod.yml config --quiet
          echo "✅ docker-compose.prod.yml is valid"

      - name: Test nginx configuration
        run: |
          docker run --rm -v $(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t
          echo "✅ Nginx configuration is valid"

      - name: Validate monitoring configuration
        run: |
          # Basic validation of monitoring configs
          if [ -f monitoring/prometheus.yml ]; then
            docker run --rm -v $(pwd)/monitoring:/config prom/prometheus:latest --config.file=/config/prometheus.yml --dry-run
            echo "✅ Prometheus configuration is valid"
          fi

  # Staging Deployment (optional)
  staging-deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [infrastructure-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add staging deployment commands here
          # Example: ./deploy.sh --staging

  # Production Deployment
  production-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [infrastructure-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production images
        run: |
          # Build and push all production images
          services=("bytebot-desktop" "bytebot-agent" "bytebot-ui" "orchestrator")

          for service in "${services[@]}"; do
            echo "Building and pushing $service..."
            docker buildx build \
              --platform linux/amd64 \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service:${{ github.sha }} \
              --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$service:latest \
              --push \
              -f bytebot/packages/$service/Dockerfile \
              .
          done

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add production deployment commands here
          # This would typically involve:
          # 1. SSH to production server
          # 2. Pull latest code
          # 3. Run deployment script
          # 4. Run health checks

      - name: Run production health checks
        run: |
          echo "🏥 Running production health checks..."
          # Add health check commands here

      - name: Notify deployment status
        if: always()
        run: |
          # Send notification about deployment status
          echo "📢 Deployment completed with status: ${{ job.status }}"

  # Rollback Job (manual trigger)
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback production deployment
        run: |
          echo "🔄 Rolling back production deployment..."
          # Add rollback commands here

  # Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [production-deploy, staging-deploy]
    steps:
      - name: Clean up old container images
        run: |
          echo "🧹 Cleaning up old container images..."
          # Add cleanup commands here