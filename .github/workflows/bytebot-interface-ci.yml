name: ByteBot & Open-Interface CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'bytebot/**'
      - 'Open-Interface/**'
      - 'docker-compose-llm.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'bytebot/**'
      - 'Open-Interface/**'
      - 'docker-compose-llm.yml'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  test-bytebot:
    name: Test ByteBot LLM Proxy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: bytebot/packages/bytebot-llm-proxy
      run: |
        pip install requests pytest pytest-mock

    - name: Run ByteBot tests
      working-directory: bytebot/packages/bytebot-llm-proxy
      run: |
        python -m pytest test_custom_provider.py -v

    - name: Test container build
      working-directory: bytebot/packages/bytebot-llm-proxy
      run: |
        docker build -t bytebot-test .

    - name: Test health check
      run: |
        docker run -d --name bytebot-health-test -p 4000:4000 bytebot-test
        sleep 10
        docker exec bytebot-health-test python3 /app/health_check.py
        docker stop bytebot-health-test

  test-open-interface:
    name: Test Open-Interface GUI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install basic dependencies
      working-directory: Open-Interface
      run: |
        pip install ttkbootstrap pillow

    - name: Test ttkbootstrap compatibility
      working-directory: Open-Interface
      run: |
        python3 -c "
        import tkinter as tk
        import ttkbootstrap as ttk
        print('ttkbootstrap version:', ttk.__version__)
        print('tkinter available')
        # Test that ttk doesn't have conflicting attributes
        if hasattr(ttk, 'W'):
            print('WARNING: ttk has W attribute')
        else:
            print('OK: ttk does not have conflicting W attribute')
        "

    - name: Test UI imports
      working-directory: Open-Interface
      run: |
        python3 -c "
        import sys
        sys.path.insert(0, '.')
        try:
            # Test basic imports
            import tkinter as tk
            import ttkbootstrap as ttk
            print('✅ Basic imports successful')

            # Test ttkbootstrap monkey patch for tkinter constants
            if not hasattr(ttk, 'W'):
                ttk.W = tk.W
                ttk.E = tk.E
                ttk.N = tk.N
                ttk.S = tk.S
            print('✅ ttkbootstrap compatibility fix applied')

        except Exception as e:
            print(f'❌ Import failed: {e}')
            exit(1)
        "

  integration-test:
    name: Integration Test ByteBot + Open-Interface
    runs-on: ubuntu-latest
    needs: [test-bytebot, test-open-interface]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Start ByteBot service
      run: |
        cd bytebot/packages/bytebot-llm-proxy
        docker build -t bytebot-integration .
        docker run -d --name bytebot-integration -p 4000:4000 bytebot-integration
        sleep 15

    - name: Test ByteBot API integration
      run: |
        # Test the debug script
        python3 debug_opencode.py
        # Check that proxy is working
        curl -f http://localhost:4000/health || exit 1

    - name: Test Open-Interface compatibility
      working-directory: Open-Interface
      run: |
        pip install ttkbootstrap pillow
        python3 test_gui.py --test-only || echo "GUI test skipped (no display)"

    - name: Cleanup
      if: always()
      run: |
        docker stop bytebot-integration || true
        docker rm bytebot-integration || true

  deploy-test:
    name: Deploy Test Environment
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy ByteBot
      run: |
        docker-compose -f docker-compose-llm.yml up -d
        sleep 30
        docker-compose -f docker-compose-llm.yml ps
        # Test health
        curl -f http://localhost:4000/health || exit 1

    - name: Cleanup deployment
      if: always()
      run: |
        docker-compose -f docker-compose-llm.yml down