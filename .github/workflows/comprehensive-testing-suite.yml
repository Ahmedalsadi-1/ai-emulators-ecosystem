name: Comprehensive Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly comprehensive tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - integration
        - e2e
        - performance
        - security
      projects:
        description: 'Specific projects to test (comma-separated)'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  TEST_RESULTS_DIR: ./test-results
  COVERAGE_DIR: ./coverage

jobs:
  # Job 1: Test Infrastructure Setup
  setup-test-infrastructure:
    name: Setup Test Infrastructure
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate test matrix
      id: generate-matrix
      run: |
        # Discover all testable projects
        projects=$(find . -name "package.json" -o -name "pyproject.toml" -o -name "setup.py" -o -name "requirements.txt" | grep -v node_modules | grep -v testing | jq -R -s -c 'split("\n") | map(select(. != "")) | map(split("/") | .[-2]) | unique | {projects: .}')

        # Generate test matrix based on project types
        matrix='{
          "include": [
            {"project": "bytebot-agent", "type": "typescript", "category": "core"},
            {"project": "factif-ai", "type": "typescript", "category": "ai"},
            {"project": "postiz-app", "type": "typescript", "category": "social"},
            {"project": "AIOS", "type": "python", "category": "ai"},
            {"project": "macOS-use", "type": "python", "category": "automation"},
            {"project": "agent-manager", "type": "typescript", "category": "management"},
            {"project": "agent-skills-system", "type": "typescript", "category": "skills"},
            {"project": "communication", "type": "typescript", "category": "communication"},
            {"project": "orchestrator", "type": "typescript", "category": "orchestration"}
          ]
        }'

        echo "matrix=$matrix" >> $GITHUB_OUTPUT

    - name: Setup test directories
      run: |
        mkdir -p ${{ env.TEST_RESULTS_DIR }}
        mkdir -p ${{ env.COVERAGE_DIR }}
        mkdir -p ./test-artifacts

    - name: Cache test dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.npm
          ~/.cache/pip
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-test-deps-${{ hashFiles('**/package-lock.json', '**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-test-deps-

  # Job 2: Parallel Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup-test-infrastructure
    strategy:
      matrix: ${{ fromJson(needs.setup-test-infrastructure.outputs.test_matrix) }}
      fail-fast: false
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: unified_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ env.NODE_VERSION }}
      if: matrix.type == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      if: matrix.type == 'python'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies - TypeScript
      if: matrix.type == 'typescript'
      working-directory: ./${{ matrix.project }}
      run: |
        npm ci
        npm run prisma:generate || true  # Generate Prisma client if applicable

    - name: Install dependencies - Python
      if: matrix.type == 'python'
      working-directory: ./${{ matrix.project }}
      run: |
        pip install -r requirements.txt
        pip install -e . || true  # Install in development mode if setup.py exists

    - name: Install shared testing utilities
      run: |
        cd testing/shared/typescript && npm install && npm run build
        cd ../python && pip install -e .

    - name: Setup test databases
      run: |
        # Setup PostgreSQL test database
        PGPASSWORD=test psql -h localhost -U test -d unified_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";" || true

        # Setup Redis test data
        redis-cli -h localhost -p 6379 SET test:key "test-value" || true

    - name: Run unit tests - TypeScript
      if: matrix.type == 'typescript'
      working-directory: ./${{ matrix.project }}
      run: |
        npm run test:unit || npm test
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/unified_test
        REDIS_URL: redis://localhost:6379
        NODE_ENV: test

    - name: Run unit tests - Python
      if: matrix.type == 'python'
      working-directory: ./${{ matrix.project }}
      run: |
        python -m pytest tests/ -v -m "unit" --cov=. --cov-report=xml --cov-report=term
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/unified_test
        REDIS_URL: redis://localhost:6379
        PYTHONPATH: ${{ github.workspace }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: unit-test-results-${{ matrix.project }}
        path: |
          **/test-results/
          **/coverage.xml
          **/coverage/
          **/*.log
        retention-days: 7

    - name: Upload coverage to Codecov
      if: matrix.type == 'python'
      uses: codecov/codecov-action@v3
      with:
        file: ./${{ matrix.project }}/coverage.xml
        flags: ${{ matrix.project }}-unit-tests
        name: ${{ matrix.project }}-coverage

  # Job 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [setup-test-infrastructure, unit-tests]
    strategy:
      matrix:
        include:
          - test_type: api-integration
            description: API integration tests
          - test_type: database-integration
            description: Database integration tests
          - test_type: websocket-integration
            description: WebSocket integration tests
          - test_type: cross-service-integration
            description: Cross-service integration tests
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup test environment
      run: |
        # Start supporting services
        docker-compose -f docker-compose.test.yml up -d postgres redis rabbitmq

        # Wait for services to be ready
        timeout 120 bash -c 'until docker-compose -f docker-compose.test.yml ps | grep -q "healthy"; do sleep 5; done'

    - name: Run API integration tests
      if: matrix.test_type == 'api-integration'
      run: |
        # Install shared testing utilities
        cd testing/shared/typescript && npm install && npm run build
        cd ../python && pip install -e .

        # Run API integration tests across all projects
        node testing/bin/test-runner.js --integration

    - name: Run database integration tests
      if: matrix.test_type == 'database-integration'
      run: |
        # Run database-specific integration tests
        docker run --network host -e DATABASE_URL=postgresql://test:test@localhost:5432/unified_test \
          -v ${{ github.workspace }}:/app \
          node:20 bash -c "cd /app && npm run test:db-integration"

    - name: Run WebSocket integration tests
      if: matrix.test_type == 'websocket-integration'
      run: |
        # Start WebSocket test server
        npm run start:test-ws-server &
        sleep 10

        # Run WebSocket integration tests
        npx playwright test tests/integration/websocket/ --headed=false

    - name: Run cross-service integration tests
      if: matrix.test_type == 'cross-service-integration'
      run: |
        # Start all services in test mode
        docker-compose -f docker-compose.ecosystem.yml up -d

        # Wait for all services to be healthy
        timeout 300 bash -c 'until curl -f http://localhost:8080/health && curl -f http://localhost:3000/health; do sleep 10; done'

        # Run cross-service tests
        npm run test:cross-service

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results-${{ matrix.test_type }}
        path: |
          **/test-results/
          **/integration-logs/
          **/*.log
        retention-days: 7

  # Job 4: End-to-End Tests
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    strategy:
      matrix:
        include:
          - browser: chromium
            shard: 1/3
          - browser: chromium
            shard: 2/3
          - browser: chromium
            shard: 3/3
          - browser: firefox
            shard: 1/1
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Playwright
      run: |
        npm install -g @playwright/test
        npx playwright install --with-deps ${{ matrix.browser }}

    - name: Start test ecosystem
      run: |
        # Start all services for E2E testing
        docker-compose -f docker-compose.ecosystem.yml up -d

        # Wait for services to be ready
        timeout 300 bash -c 'until curl -f http://localhost:8080/health && curl -f http://localhost:3000 && curl -f http://localhost:3001/health; do sleep 10; done'

    - name: Run E2E tests
      run: |
        npx playwright test \
          --browser=${{ matrix.browser }} \
          --shard=${{ matrix.shard }} \
          --reporter=html,json \
          --output=test-results/e2e \
          tests/e2e/

      env:
        E2E_BASE_URL: http://localhost:3000
        E2E_API_URL: http://localhost:8080
        E2E_WS_URL: ws://localhost:8080

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-results-${{ matrix.browser }}-${{ matrix.shard }}
        path: |
          test-results/e2e/
          playwright-report/
        retention-days: 7

    - name: Upload E2E screenshots and videos on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-failures-${{ matrix.browser }}-${{ matrix.shard }}
        path: |
          test-results/e2e/screenshots/
          test-results/e2e/videos/
        retention-days: 14

  # Job 5: Embedded UI Integration Tests
  embedded-ui-tests:
    name: Embedded UI Integration Tests
    runs-on: ubuntu-latest
    needs: e2e-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Playwright
      run: npx playwright install --with-deps chromium

    - name: Start embedded UI test environment
      run: |
        # Start services with embedded UI components
        docker-compose -f docker-compose.embedded-ui.yml up -d

        # Wait for embedded UI test pages to be ready
        timeout 120 bash -c 'until curl -f http://localhost:3002/embedded-test; do sleep 5; done'

    - name: Run embedded UI integration tests
      run: |
        npx playwright test \
          --browser=chromium \
          --reporter=html,json \
          tests/embedded-ui/ \
          --grep-invert "performance"

      env:
        EMBEDDED_UI_TEST_URL: http://localhost:3002

    - name: Run embedded UI performance tests
      run: |
        npx playwright test \
          --browser=chromium \
          --reporter=json \
          tests/embedded-ui/ \
          --grep "performance"

    - name: Upload embedded UI test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: embedded-ui-test-results
        path: |
          test-results/embedded-ui/
          playwright-report/
        retention-days: 7

  # Job 6: Performance and Load Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests, e2e-tests]
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf-test]') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup k6
      run: |
        curl https://github.com/grafana/k6/releases/download/v0.45.0/k6-v0.45.0-linux-amd64.tar.gz -L | tar xvz
        sudo mv k6-v0.45.0-linux-amd64/k6 /usr/local/bin/k6

    - name: Start performance test environment
      run: |
        # Start services with performance monitoring
        docker-compose -f docker-compose.performance.yml up -d

        # Wait for services and monitoring
        timeout 180 bash -c 'until curl -f http://localhost:8080/health && curl -f http://localhost:3000; do sleep 10; done'

    - name: Run API performance tests
      run: |
        k6 run \
          --out json=test-results/perf/api-performance.json \
          --tag test_type=api_performance \
          tests/performance/api-load-test.js

    - name: Run WebSocket performance tests
      run: |
        k6 run \
          --out json=test-results/perf/websocket-performance.json \
          --tag test_type=websocket_performance \
          tests/performance/websocket-load-test.js

    - name: Run database performance tests
      run: |
        k6 run \
          --out json=test-results/perf/database-performance.json \
          --tag test_type=database_performance \
          tests/performance/database-load-test.js

    - name: Generate performance report
      run: |
        # Generate comprehensive performance report
        node scripts/generate-performance-report.js \
          --results-dir=test-results/perf \
          --output=performance-report.html

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: |
          test-results/perf/
          performance-report.html
        retention-days: 30

  # Job 7: Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[security-test]')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install security testing tools
      run: |
        pip install safety bandit semgrep
        npm install -g audit-ci njsscan

    - name: Run dependency vulnerability scans
      run: |
        # Python dependencies
        safety check --full-report

        # Node.js dependencies
        audit-ci --config audit-ci.json

    - name: Run SAST (Static Application Security Testing)
      run: |
        # Python SAST
        bandit -r . -f json -o test-results/security/bandit-report.json || true

        # Semgrep for multi-language analysis
        semgrep --config auto --json -o test-results/security/semgrep-report.json . || true

        # Node.js security scan
        njsscan . --json -o test-results/security/njsscan-report.json || true

    - name: Run authentication security tests
      run: |
        npm run test:security -- --testPathPattern="authentication.*security" --testNamePattern="Security"

    - name: Run API security tests
      run: |
        # OWASP ZAP baseline scan (if configured)
        docker run --rm -v $(pwd):/zap/wrk owasp/zap2docker-stable zap-baseline.py \
          -t http://host.docker.internal:3000 \
          -r test-results/security/zap-report.html || true

    - name: Generate security report
      run: |
        # Aggregate all security findings
        node scripts/generate-security-report.js \
          --results-dir=test-results/security \
          --output=security-report.html

        # Check for critical vulnerabilities
        if grep -q "CRITICAL\|HIGH" test-results/security/*.json; then
          echo "🚨 Critical or high-severity security issues found!"
          exit 1
        fi

    - name: Upload security test results
      uses: actions/upload-artifact@v3
      with:
        name: security-test-results
        path: |
          test-results/security/
          security-report.html
        retention-days: 30

  # Job 8: Test Results Aggregation and Reporting
  test-results-aggregation:
    name: Test Results Aggregation
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, embedded-ui-tests, performance-tests, security-tests]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all test artifacts
      uses: actions/download-artifact@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install reporting tools
      run: |
        npm install -g allure-commandline
        pip install pytest-html

    - name: Aggregate test results
      run: |
        # Create comprehensive test report
        mkdir -p aggregated-results

        # Aggregate JUnit XML results
        npx junit-merge -d . -o aggregated-results/junit-report.xml

        # Generate HTML test report
        npx junit2html aggregated-results/junit-report.xml -o aggregated-results/test-report.html

        # Calculate coverage metrics
        node scripts/calculate-coverage.js > aggregated-results/coverage-summary.json

        # Generate test summary
        node scripts/generate-test-summary.js \
          --results-dir=. \
          --output=aggregated-results/test-summary.json

    - name: Generate Allure report
      run: |
        # Generate Allure report from test results
        allure generate \
          --clean \
          --output aggregated-results/allure-report \
          test-results/

    - name: Check quality gates
      run: |
        # Check test coverage threshold
        COVERAGE=$(jq -r '.total.lines.pct' aggregated-results/coverage-summary.json)
        if (( $(echo "$COVERAGE < 85.0" | bc -l) )); then
          echo "❌ Code coverage $COVERAGE% is below 85% threshold"
          exit 1
        fi

        # Check test success rate
        SUCCESS_RATE=$(jq -r '.success_rate' aggregated-results/test-summary.json)
        if (( $(echo "$SUCCESS_RATE < 95.0" | bc -l) )); then
          echo "❌ Test success rate $SUCCESS_RATE% is below 95% threshold"
          exit 1
        fi

        echo "✅ All quality gates passed"

    - name: Comment test results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const testSummary = JSON.parse(fs.readFileSync('aggregated-results/test-summary.json', 'utf8'));

          const comment = `
          ## 🧪 Comprehensive Test Results

          ### Test Summary
          - **Total Tests**: ${testSummary.total_tests}
          - **Passed**: ${testSummary.passed_tests}
          - **Failed**: ${testSummary.failed_tests}
          - **Success Rate**: ${testSummary.success_rate}%

          ### Coverage
          - **Line Coverage**: ${testSummary.coverage.line}%
          - **Branch Coverage**: ${testSummary.coverage.branch}%
          - **Function Coverage**: ${testSummary.coverage.function}%

          ### Test Categories
          ${Object.entries(testSummary.categories).map(([category, stats]) =>
            `- **${category}**: ${stats.passed}/${stats.total} passed`
          ).join('\n')}

          ${testSummary.failed_tests > 0 ?
            '### ❌ Failed Tests\n' + testSummary.failures.map(f => `- ${f.test}: ${f.error}`).join('\n') :
            '### ✅ All Tests Passed'
          }

          [📊 View Detailed Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload aggregated test results
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-results
        path: |
          aggregated-results/
        retention-days: 30

  # Job 9: Deployment Tests
  deployment-tests:
    name: Deployment Tests
    runs-on: ubuntu-latest
    needs: [test-results-aggregation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker Compose deployment
      run: |
        # Test development deployment
        docker-compose -f docker-compose.ecosystem.yml build --parallel
        docker-compose -f docker-compose.ecosystem.yml up -d

        # Wait for services and run health checks
        timeout 300 bash -c 'until docker-compose -f docker-compose.ecosystem.yml ps | grep -q "healthy\|running"; do sleep 10; done'

        # Run deployment smoke tests
        npm run test:deployment-smoke

        # Cleanup
        docker-compose -f docker-compose.ecosystem.yml down

    - name: Test Kubernetes deployment (staging)
      run: |
        # Install kubectl and helm
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl && sudo mv kubectl /usr/local/bin/

        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

        # Deploy to staging cluster (mock/test cluster)
        cd bytebot/helm
        helm dependency update
        helm template test-release . --set image.tag=${{ github.sha }} > k8s-manifests.yaml

        # Validate manifests
        kubectl apply --dry-run=client -f k8s-manifests.yaml

    - name: Upload deployment test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: deployment-test-results
        path: |
          deployment-test-results/
          k8s-manifests.yaml
        retention-days: 7

  # Job 10: Final Status Check
  final-status:
    name: Final Status Check
    runs-on: ubuntu-latest
    needs: [test-results-aggregation, deployment-tests]
    if: always()

    steps:
    - name: Determine overall status
      run: |
        # Check if all required jobs succeeded
        if [[ "${{ needs.test-results-aggregation.result }}" == "success" && \
              "${{ needs.deployment-tests.result }}" == "success" ]]; then
          echo "🎉 All tests and deployments successful!"
          echo "status=success" >> $GITHUB_OUTPUT
        elif [[ "${{ needs.test-results-aggregation.result }}" == "failure" ]]; then
          echo "❌ Test failures detected"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "⚠️ Some tests were skipped or had issues"
          echo "status=partial" >> $GITHUB_OUTPUT
        fi

    - name: Create deployment notification
      if: success() && github.ref == 'refs/heads/main'
      run: |
        # Notify deployment systems of successful test completion
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_WEBHOOK_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{\"status\": \"tests_passed\", \"commit\": \"${{ github.sha }}\", \"environment\": \"production\"}" \
          ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}

    - name: Update test status badge
      if: always()
      run: |
        # Update status badge data
        STATUS="${{ steps.status.outputs.status }}"
        curl -X POST \
          -H "Authorization: Bearer ${{ secrets.BADGE_UPDATE_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{\"status\": \"$STATUS\", \"timestamp\": \"$(date -Iseconds)\"}" \
          ${{ secrets.BADGE_UPDATE_URL }}