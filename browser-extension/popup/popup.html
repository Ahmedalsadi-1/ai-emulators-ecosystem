<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONOS-OS Browser Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="#6d28d9" stroke-width="2"/>
                    <path d="M8 12 L16 12 M12 8 L12 16" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>KRONOS-OS</h1>
            <span class="version">v1.0.0</span>
        </div>

        <!-- Connection Status -->
        <div class="connection-status" id="connectionStatus">
            <div class="status-dot connected"></div>
            <span class="status-text">Connected to KRONOS-OS</span>
        </div>

        <!-- Workspace Section -->
        <div class="section">
            <h2 class="section-title">Desktop Workspaces</h2>
            <div class="workspace-grid">
                <button class="workspace-btn active" data-workspace="kron-1">
                    <div class="workspace-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="18" rx="2" stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="workspace-label">KRON-1</span>
                    <span class="workspace-port">:9990</span>
                </button>
                <button class="workspace-btn" data-workspace="kron-2">
                    <div class="workspace-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="18" rx="2" stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="workspace-label">KRON-2</span>
                    <span class="workspace-port">:9995</span>
                </button>
                <button class="workspace-btn" data-workspace="kron-3">
                    <div class="workspace-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="18" rx="2" stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="workspace-label">KRON-3</span>
                    <span class="workspace-port">:9993</span>
                </button>
            </div>
        </div>

        <!-- Browser Workspace Section -->
        <div class="section">
            <h2 class="section-title">Browser Workspaces</h2>
            <div class="workspace-grid">
                <button class="workspace-btn" data-workspace="android">
                    <div class="workspace-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="18" rx="2" stroke-width="2"/>
                            <circle cx="17" cy="8" r="5" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="12" cy="16" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="workspace-label">ANDROID</span>
                    <span class="workspace-port">:5555</span>
                </button>
                <button class="workspace-btn" data-workspace="ui-tars">
                    <div class="workspace-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 6 L12 4 M8 12 L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M12 4 L12 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="workspace-label">UI-TARS</span>
                    <span class="workspace-port">:8766</span>
                </button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="section">
            <h2 class="section-title">Quick Actions</h2>
            <div class="actions-grid">
                <button class="action-btn" id="newTaskBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="9" stroke="currentColor" stroke-width="2"/>
                        <path d="M9 11 H13 L11 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>New Task</span>
                </button>
                <button class="action-btn" id="settingsBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 17 L12 7 M12 10 L12 14 M11 10 L13 14 M11 14 L13 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <button class="footer-btn" id="openSidePanel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/>
                    <path d="M8 12 L16 12 M12 8 L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="footer-btn" id="openAgents">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="8" cy="12" r="6" stroke="currentColor" stroke-width="2"/>
                    <circle cx="16" cy="12" r="6" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
